[build]
  publish = "."

[[redirects]]
  from = "/admin2"
  to = "/admin2/"
  status = 301

[[headers]]
  for = "/admin2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
