<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FrenchSaaS Admin</title>
  <link rel="stylesheet" href="./assets/admin2.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <p class="eyebrow">FrenchSaaS</p>
      <h1>Espace d’administration</h1>
      <p class="muted">Connecte-toi pour gérer tes articles, ton SEO, tes leads et tes idées de contenu.</p>
      <label>Email<input id="email" type="email" autocomplete="username" required value="admin@frenchsaas.com"></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required value="ChangeMe123!"></label>
      <button type="submit">Se connecter</button>
      <p id="loginError" class="error" hidden>Identifiants incorrects.</p>
      <p class="tiny">Démo locale. À remplacer par Netlify Identity, Clerk ou Supabase Auth en production.</p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="logo">FS</span><div><strong>FrenchSaaS</strong><small>Admin</small></div></div>
      <nav>
        <button data-view="dashboard" class="active">Tableau de bord</button>
        <button data-view="articles">Articles</button>
        <button data-view="seo">SEO</button>
        <button data-view="leads">Leads</button>
        <button data-view="ideas">Idées</button>
        <button data-view="services">Services</button>
        <button data-view="settings">Paramètres</button>
      </nav>
      <button id="logoutBtn" class="ghost">Déconnexion</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">Mini WordPress sur mesure</p><h1 id="pageTitle">Tableau de bord</h1></div>
        <button id="newArticleTop" class="primary">Nouvel article</button>
      </header>
      <section id="viewRoot"></section>
    </main>
  </div>

  <template id="dashboardTpl">
    <div class="grid cards">
      <article class="card"><small>Visiteurs ce mois-ci</small><strong id="metricVisitors">—</strong><span>+18 %</span></article>
      <article class="card"><small>Clics Google</small><strong id="metricClicks">—</strong><span>+33 %</span></article>
      <article class="card"><small>Position moyenne</small><strong id="metricPosition">—</strong><span>À améliorer</span></article>
      <article class="card"><small>Leads</small><strong id="metricLeads">—</strong><span>Ce mois-ci</span></article>
    </div>
    <div class="two-col">
      <article class="panel"><h2>Articles récents</h2><div id="recentArticles"></div></article>
      <article class="panel"><h2>Opportunités SEO</h2><div id="seoOpportunities"></div></article>
    </div>
  </template>

  <template id="articlesTpl">
    <div class="toolbar"><input id="articleSearch" placeholder="Rechercher un article…"><button id="newArticleBtn">Créer</button><button id="exportAllBtn" class="ghost">Exporter JSON</button></div>
    <div class="editor-layout"><div class="panel list" id="articleList"></div><div class="panel editor" id="articleEditor"></div><div class="panel preview" id="articlePreview"></div></div>
  </template>

  <template id="seoTpl">
    <div class="two-col">
      <article class="panel"><h2>Top requêtes</h2><div id="queriesList"></div></article>
      <article class="panel"><h2>Pages à optimiser</h2><div id="seoPagesList"></div></article>
    </div>
    <article class="panel"><h2>Problèmes SEO détectés</h2><div id="issuesList"></div></article>
  </template>

  <template id="leadsTpl"><article class="panel"><h2>Demandes entrantes</h2><div id="leadsList"></div></article></template>
  <template id="ideasTpl"><article class="panel"><h2>Idées de contenu</h2><div id="ideasList"></div></article></template>
  <template id="servicesTpl"><article class="panel"><h2>Services</h2><p>Modifie ici les blocs de services à terme : SaaS localization, SEO translation, LQA, French market adaptation.</p><textarea rows="12">SaaS localization\nSEO translation\nFrench UX copy review\nLocalization QA</textarea><button>Sauvegarder localement</button></article></template>
  <template id="settingsTpl"><article class="panel"><h2>Paramètres</h2><p>Configuration prévue : identité du site, intégrations SEO, Analytics, Search Console, Netlify Forms, GitHub API.</p><label>Nom du site<input value="FrenchSaaS"></label><label>Domaine<input value="frenchsaas.com"></label><label>Email admin<input value="admin@frenchsaas.com"></label><button>Sauvegarder localement</button></article></template>

  <script src="./assets/admin2.js" type="module"></script>
</body>
</html>
